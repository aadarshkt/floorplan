[project]
name = "floorplan"
version = "0.1.0"
description = "Phone capture (photos / video / LiDAR) to dimensioned multi-room floor plan"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "open3d>=0.18",
    "pillow>=10.0",
    "ezdxf>=1.1",
    "svgwrite>=1.4",
    "structlog>=24.1",
    "lzfse>=0.4",                   # Record3D .r3d depth/confidence
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
floorplan = "floorplan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["floorplan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
